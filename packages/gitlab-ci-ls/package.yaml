---
name: gitlab-ci-ls
description: Language server for GitLab CI (RiceKrisBs fork with template includes and !reference navigation).
homepage: https://github.com/RiceKrisBs/gitlab-ci-ls
licenses:
  - MIT
languages:
  - YAML
categories:
  - LSP

source:
  id: pkg:github/RiceKrisBs/gitlab-ci-ls@v1.4.0-kb.2
  asset:
    - target: darwin_arm64
      file: gitlab-ci-ls-aarch64-apple-darwin.tar.gz
      bin: gitlab-ci-ls

schemas:
  lsp: vscode:https://raw.githubusercontent.com/RiceKrisBs/gitlab-ci-ls/{{version}}/vscode-extension/package.json

bin:
  gitlab-ci-ls: "{{source.asset.bin}}"

neovim:
  lspconfig: gitlab_ci_ls
